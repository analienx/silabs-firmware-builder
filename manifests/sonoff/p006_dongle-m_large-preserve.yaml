name: SONOFF Dongle-M P006 LARGE Preserve
device: EFR32MG24A420F1536IM48
base_project: src/zigbee_ncp
filename: "{manifest_name}_{sdk_version}_{fw_version}_{baudrate}_{fw_variant}"
sdk: "simplicity_sdk:2026.6.1"
toolchain: "gcc:14.2.1"

gbl:
  fw_type: zigbee_ncp
  baudrate: 115200
  fw_variant: sw_flow

c_defines:
  SL_IOSTREAM_EUSART_VCOM_BAUDRATE: 115200
  SL_IOSTREAM_EUSART_VCOM_FLOW_CONTROL_TYPE: SL_IOSTREAM_EUSART_UART_FLOW_CTRL_NONE
  SL_IOSTREAM_EUSART_VCOM_PERIPHERAL: EUSART1
  SL_IOSTREAM_EUSART_VCOM_PERIPHERAL_NO: 1
  SL_IOSTREAM_EUSART_VCOM_TX_PORT: SL_GPIO_PORT_C
  SL_IOSTREAM_EUSART_VCOM_TX_PIN: 1
  SL_IOSTREAM_EUSART_VCOM_RX_PORT: SL_GPIO_PORT_C
  SL_IOSTREAM_EUSART_VCOM_RX_PIN: 2
  SL_IOSTREAM_EUSART_VCOM_CTS_PORT: 0
  SL_IOSTREAM_EUSART_VCOM_CTS_PIN: 0
  SL_IOSTREAM_EUSART_VCOM_RTS_PORT: 0
  SL_IOSTREAM_EUSART_VCOM_RTS_PIN: 0
  SL_CLOCK_MANAGER_HFXO_CTUNE: 100
  SL_CLOCK_MANAGER_HFXO_FREQ: 38400000
  SL_CLOCK_MANAGER_HFXO_PRECISION: 10
  SL_RAIL_UTIL_RSSI_OFFSET: 0

  SL_ZIGBEE_APS_UNICAST_MESSAGE_COUNT: 128
  SL_ZIGBEE_BINDING_TABLE_SIZE: 32
  SL_ZIGBEE_BROADCAST_TABLE_SIZE: 64
  SL_ZIGBEE_KEY_TABLE_SIZE: 20
  SL_ZIGBEE_MAX_END_DEVICE_CHILDREN: 32
  SL_ZIGBEE_SOURCE_ROUTE_TABLE_SIZE: 254
  SL_ZIGBEE_NEIGHBOR_TABLE_SIZE: 26
  SL_ZIGBEE_ADDRESS_TABLE_SIZE: 128
  SL_ZIGBEE_APS_DUPLICATE_REJECTION_MAX_ENTRIES: 64
  SL_ZIGBEE_PACKET_BUFFER_HEAP_SIZE: SL_ZIGBEE_HUGE_PACKET_BUFFER_HEAP
  SL_ZIGBEE_ROUTE_TABLE_SIZE:
    type: c_flag
    value: 254
  SL_ZIGBEE_MULTICAST_TABLE_SIZE:
    type: c_flag
    value: 26
  SL_ZIGBEE_DISCOVERY_TABLE_SIZE:
    type: c_flag
    value: 16
